<!DOCTYPE html>
<html>
<head>
  <title>Authentiscan</title>
  <style>
    body { font-family: Arial; background: #f4f6fa; }
    .container {
      width: 80%;
      margin: 40px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }
    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      background: #1f4b99;
      color: white;
      border: none;
      cursor: pointer;
    }
    .result { margin-top: 20px; }
    .high { color: red; }
    .medium { color: orange; }
    .low { color: green; }
  </style>
</head>
<body>

<div class="container">
  <h2>Authentiscan</h2>
  <textarea id="text"></textarea>
  <br>
  <button onclick="scan()">Scan</button>

  <div class="result" id="result"></div>
</div>

<script>
async function scan() {
  const text = document.getElementById("text").value;

  const response = await fetch("http://127.0.0.1:8000/scan", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text })
  });

  const data = await response.json();

  let html = `<h3>Overall Similarity: ${data.overall_similarity}%</h3>`;

  data.details.forEach(d => {
    let cls = d.score > 75 ? "high" : d.score > 40 ? "medium" : "low";

    html += `<p class="${cls}">
      ${d.sentence} → ${d.score}% (${d.status})
    </p>`;
  });

  document.getElementById("result").innerHTML = html;
}
</script>

</body>
</html>
